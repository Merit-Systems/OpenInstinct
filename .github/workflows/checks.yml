# foundation:checks:v1
name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: Merit-Systems/foundation/.github/workflows/checks.yml@v1
    with:
      # Source integrity runs below with the caller workflow's trusted OIDC
      # identity; the reusable workflow has a distinct job_workflow_ref claim.
      check-command: pnpm check:foundation
    secrets: inherit

  registry-integrity:
    name: UI source integrity
    permissions:
      contents: read
      id-token: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Verify Foundation UI sources
        run: pnpm ui:integrity:github
