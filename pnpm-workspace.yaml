minimumReleaseAgeStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Eve 0.44.4's current official scaffold resolves the matching AI SDK release cohort.
  - "@ai-sdk/*"
  - ai
  - "@vercel/*"
  - "@onkernel/*"
  - eve
  # These browser and rendering transitive releases are locked by the current Eve UI scaffold.
  - baseline-browser-mapping
  - caniuse-lite
  - electron-to-chromium
  - mermaid
  - picomatch
  - systeminformation
allowBuilds:
  "@google/genai": false
  cbor-extract: false
  esbuild: true
  protobufjs: false
  sharp: true
patchedDependencies:
  eve@0.49.0: patches/eve@0.49.0.patch
